<template>
    <lightning-card title="Speakers">

        <!-- Speaker Table -->
        <template if:true={speakers.length}>
            <lightning-datatable
                key-field="Id"
                data={speakers}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <!-- No Data Message -->
        <template if:true={showNoData}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <p class="slds-text-color_error slds-text-heading_small">
                    🚫 Speaker Not Found
                </p>
            </div>
        </template>

    </lightning-card>
</template>

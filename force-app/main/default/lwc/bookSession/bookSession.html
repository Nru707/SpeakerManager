<template>
    <lightning-card title="Speaker Booking">

        <!-- Legend (Top Right) -->
        <template if:true={speaker}>
            <div class="calendar-legend">
                <span class="legend booked"></span>
                <span>Already booked</span>
            </div>
        </template>

        <template if:true={speaker}>
            <div class="slds-p-around_medium">
                <p><b>Name:</b> {speaker.Name}</p>
                <p><b>Speciality:</b> {speaker.Speciality__c}</p>
                <p><b>Bio:</b> {speaker.Bio__c}</p>

                <!-- Month Navigation -->
                <div class="calendar-header">
                    <lightning-button-icon
                        icon-name="utility:chevronleft"
                        onclick={prevMonth}>
                    </lightning-button-icon>

                    <span class="month-label">{monthLabel}</span>

                    <lightning-button-icon
                        icon-name="utility:chevronright"
                        onclick={nextMonth}>
                    </lightning-button-icon>
                </div>

                <!-- WEEK HEADER  -->
                <div class="week-header">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <!-- Calendar Dates -->
                <div class="calendar-grid">
                    <template for:each={calendarDates} for:item="d">
                        <div key={d.value}
                             data-date={d.value}
                             class={d.cssClass}
                             onclick={selectCalendarDate}>
                            {d.label}
                        </div>
                    </template>
                </div>

                <lightning-button
                    label="Book Session"
                    variant="brand"
                    class="slds-m-top_medium"
                    disabled={disableCreate}
                    onclick={handleCreate}>
                </lightning-button>
            </div>
        </template>

        <template if:false={speaker}>
            <p class="slds-p-around_medium">
                Select a speaker from speakers for the booking.
            </p>
        </template>

    </lightning-card>
</template>

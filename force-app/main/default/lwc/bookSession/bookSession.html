<template>
    <lightning-card title="Speaker Booking">
        <!-- No speaker selected -->
        <template if:false={speaker}>
            <p class="slds-p-around_medium">Select a speaker</p>
        </template>

        <!-- Speaker details -->
        <template if:true={speaker}>
            <div class="slds-p-around_medium">
                <p><b>Name:</b> {speaker.Name}</p>
                <p><b>Speciality:</b> {speaker.Speciality__c}</p>
                <p><b>Bio:</b> {speaker.Bio__c}</p>

                <!-- Calendar -->
                <div class="calendar-grid">
                    <template for:each={calendarDates} for:item="date">
                        <div key={date.value}
                             class={date.cssClass}
                             data-date={date.value}
                             onclick={selectCalendarDate}>
                            {date.label}
                        </div>
                    </template>
                </div>
            </div>
            <lightning-button
                label="Book Session"
                variant="brand"
                disabled={disableCreate}
                onclick={handleCreate}
                class="slds-m-around_medium slds-p-around_small">
            </lightning-button>

        </template>
    </lightning-card>
</template>

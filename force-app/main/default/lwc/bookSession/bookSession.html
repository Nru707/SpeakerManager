<template>
    <lightning-card title="Speaker Details & Booking">
        <template if:true={speaker}>
            <div class="slds-p-around_small">
                <p><strong>Name:</strong> {speaker.Name}</p>
                <p><strong>Speciality:</strong> {speaker.Speciality__c}</p>
                <p><strong>Bio:</strong> {speaker.Bio__c}</p>

                <lightning-input 
                    type="date" 
                    label="Select Date" 
                    value={selectedDate} 
                    onchange={handleDateChange}>
                </lightning-input>

                <lightning-button
                    label="Create Assignment"
                    disabled={isBookingDisabled}
                    onclick={handleCreateAssignment}
                    class="slds-m-top_small">
                </lightning-button>
            </div>
        </template>

        <template if:false={speaker}>
            <div class="slds-p-around_small">
                <p>Select a speaker from the left panel</p>
            </div>
        </template>
    </lightning-card>
</template>

<template>
    <lightning-card title="Speaker Booking">
        <!-- Initial / No speaker -->
        <template if:false={speaker}>
            <p class="slds-p-around_medium">Select a speaker</p>
        </template>

        <!-- Speaker details -->
        <template if:true={speaker}>
            <div class="slds-p-around_medium">
                <p><b>Name:</b> {speaker.Name}</p>
                <p><b>Speciality:</b> {speaker.Speciality__c}</p>
                <p><b>Bio:</b> {speaker.Bio__c}</p>

                <!-- Date selection -->
                <lightning-input
                    type="date"
                    label="Select Date"
                    onchange={handleDateChange}
                    min={today}>
                </lightning-input>

                <lightning-button
                    label="Create Assignment"
                    variant="brand"
                    disabled={disableCreate}
                    onclick={handleCreate}
                    class="slds-m-top_small">
                </lightning-button>
            </div>
        </template>
    </lightning-card>
</template>

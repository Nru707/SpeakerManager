<template>
   <lightning-layout horizontal-align="start">
    <lightning-layout-item padding="around-small" size="6">
        <c-speaker-search onfilterchange={handleFilterChange}></c-speaker-search>
        <c-speaker-list 
            name={name} 
            speciality={speciality} 
            onspeakerselect={handleSpeakerSelect}>
        </c-speaker-list>
    </lightning-layout-item>

    <lightning-layout-item padding="around-small" size="6">
        <c-book-session speaker-id={selectedSpeakerId}></c-book-session>
    </lightning-layout-item>
</lightning-layout>

</template>

<template>
    <lightning-card title="Search Speakers">
        <div class="slds-p-around_medium">
            <lightning-input
                label="Speaker Name"
                value={name}
                onchange={handleNameChange}>
            </lightning-input>

            <lightning-combobox
                label="Speciality"
                options={specialityOptions}
                value={speciality}
                onchange={handleSpecialityChange}>
            </lightning-combobox>
        </div>
    </lightning-card>
</template>
